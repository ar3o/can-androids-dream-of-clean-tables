[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleantables"
version = "0.1.0"
description = "Phone videos of table tidying -> physics twins in Isaac Sim -> a V-JEPA + 3D world model -> bimanual dexterous RL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "pillow",
    "trimesh",
    "imageio[ffmpeg]",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# perception and world model (one environment)
vision = ["torch>=2.4", "transformers>=4.56", "sentence-transformers", "accelerate", "google-genai"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["cleantables*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
