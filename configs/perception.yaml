# Video perception (cleantables.perception): video -> depth, table frame, object tracks, events, video features.

environment:
  # SAM 3 runs in its own Python environment; its workers are started as subprocesses.
  # Values are read from the environment variables named here (see docs/installation.md).
  sam3_python: $SAM3_PY
  sam3_repo: $SAM3_REPO
  sam3_checkpoint: $SAM3_CHECKPOINT
  # Extra PYTHONPATH entries for the depth worker, only needed when MoGe is not pip-installed.
  moge_pythonpath: []

frames:
  fps: 10                     # work frames per second
  width: 960
  height: 540
  jpeg_quality: 95

depth:
  model: Ruicheng/moge-3-vitl
  stride: 3                   # depth is computed on every 3rd work frame (the tracked frames); the others copy it
  fov_frames: 8               # frames whose field-of-view estimates are pooled (median) into one per video
  resolution_level: 9
  refine_steps: 1
  min_free_mib: 3200

objects:
  vlm: Qwen/Qwen3-VL-4B-Instruct
  vlm_gpu_min_free_mib: 11000 # the VLM runs on the GPU only when this much is free, else on the CPU
  merge_similarity: 0.90      # MiniLM cosine: near-duplicate wordings
  collapse_similarity: 0.75   # MiniLM cosine: synonyms of one object type
  max_phrases: 6              # candidate phrases per video
  add_episode_objects: true   # also check the episode labels' object names that the listing missed
  keyframes: 12               # SAM 3 image keyframes per video (table fit and name check)
  keyframe_min_prob: 0.3
  keyframe_min_free_mib: 5000
  name_min_prob: 0.5          # detection counts in the name check
  name_keep_prob: 0.6         # a phrase is kept if it is the best name of an instance at least this confident
  max_vocabulary: 10

video:
  stride: 3                   # SAM 3 video tracking on every 3rd work frame (3.3 fps)
  min_free_mib: 6800
  text_on_gpu_min_free_mib: 8000
  state_on_gpu_min_free_mib: 8000
  feature_cache: true
  # Videos with more tracked frames than this are tracked in per-episode windows (episodes.json, margin below);
  # the SAM 3 session memory grows with its length.
  window_min_frames: 600
  window_margin_s: 1.0

vision:
  model: facebook/dinov2-base
  gpu_min_free_mib: 1500

video_features:
  model: facebook/vjepa2-vitl-fpc64-256
  min_free_mib: 3000
