# World-model imitation training (cleantables.worldmodel.train) and held-out evaluation.
steps: 3000
batch_size: 32
lr: 3.0e-4
weight_decay: 0.05
warmup_steps: 100
grad_clip: 3.0
seeds: [0, 1, 2]
d_model: 256
layers: 6

# augmentation
p_mirror: 0.5
p_rotate: 0.5
p_scale: 0.3
max_scale: 1.25
p_replace: 0.25        # re-place objects not involved in the move
p_object_drop: 0.15

# modality dropout: video + 3D / 3D only / video only (the rest)
p_both: 0.5
p_3d: 0.25

# loss weights
w_flow: 2.0
w_prog: 1.0
w_prog_abs: 3.0        # binary cross-entropy on the progress label
w_jepa: 1.0
w_seen: 0.2

# evaluation: imagined paths per ensemble, split evenly over the members
eval_samples: 12
